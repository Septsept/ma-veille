<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma veille quotidienne</title>
  <meta name="description" content="Veille d'actualité quotidienne classée par rubriques, à partir de médias indépendants.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#121418">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">Ma veille <span>quotidienne</span></div>
      <div class="top-right">
        <span class="updated" id="updated"></span>
        <select id="period" class="period" aria-label="Période">
          <option value="1">Aujourd'hui</option>
          <option value="7">7 derniers jours</option>
          <option value="30">30 derniers jours</option>
        </select>
      </div>
    </div>
  </header>

  <div class="wrap shell">
    <nav class="menu" id="menu" aria-label="Rubriques"></nav>
    <main>
      <div class="mbar"><button type="button" id="mbtn" aria-expanded="false" aria-controls="sheet"></button></div>
      <nav class="sheet" id="sheet" aria-label="Rubriques" data-open="false"></nav>
      <div id="content" aria-live="polite"><p class="notice">Chargement de la veille...</p></div>
    </main>
  </div>

  <footer class="foot">
    <div class="wrap">
      <p>Résumés rédigés à partir des sources citées. Articles et images restent la propriété de leurs médias.</p>
    </div>
  </footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
